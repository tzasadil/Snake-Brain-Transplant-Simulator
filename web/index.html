<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake Brain Transplant Simulator</title>
    <meta name="description" content="Give a snake a neural net, fruit fly, or worm brain, and watch it evolve." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect width='10' height='10' rx='2' fill='%234ade80'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Snake Brain Transplant Simulator</h1>
        <p>Give a snake a neural net, fruit fly, or worm brain, and watch it evolve.</p>
        <a href="https://github.com/tzasadil/Snake-Brain-Transplant-Simulator">Source</a>
      </header>

      <section class="stage">
        <figure class="panel">
          <canvas id="board" class="board" role="img" aria-label="Snake board with vision rays"></canvas>
          <div class="board-foot">
            <dl class="stats">
              <div><dt>Generation</dt><dd id="generation">–</dd></div>
              <div><dt>Score</dt><dd id="score">0</dd></div>
              <div><dt>Status</dt><dd id="outcome">Training</dd></div>
            </dl>
            <label>Speed
              <select id="speed">
                <option value="1">1×</option>
                <option value="2" selected>2×</option>
                <option value="4">4×</option>
                <option value="8">8×</option>
              </select>
            </label>
          </div>
        </figure>

        <figure class="panel brain">
          <label class="brain-picker">Brain
            <select id="brain">
              <option value="fly" id="fly-option" selected>Fruit fly</option>
              <option value="worm" id="worm-option">Worm</option>
              <option value="net">Neural net</option>
            </select>
          </label>
          <canvas id="network" class="network" role="img"
            aria-label="Snake brain, lit by activity"></canvas>
          <ul class="legend" id="legend-net" hidden>
            <li style="--swatch: var(--wall)">Wall</li>
            <li style="--swatch: var(--snake)">Body</li>
            <li style="--swatch: var(--fruit)">Fruit</li>
            <li style="--swatch: var(--positive)">Weight +</li>
            <li style="--swatch: var(--negative)">Weight −</li>
          </ul>
          <ul class="legend" id="legend-fly">
            <li style="--swatch: var(--input)">Visual input</li>
            <li style="--swatch: var(--text)">Interneuron</li>
            <li style="--swatch: var(--snake)">Steering</li>
            <li style="--swatch: var(--positive)">Excites</li>
            <li style="--swatch: var(--negative)">Inhibits</li>
            <li class="credit"><a href="https://male-cns.janelia.org">Male CNS v1.0</a> connectome, CC BY 4.0</li>
          </ul>
          <ul class="legend" id="legend-worm" hidden>
            <li style="--swatch: var(--input)">Head sensory</li>
            <li style="--swatch: var(--text)">Interneuron</li>
            <li style="--swatch: var(--snake)">Head motor</li>
            <li style="--swatch: var(--positive)">Excites</li>
            <li style="--swatch: var(--negative)">Inhibits</li>
            <li style="--swatch: var(--gap)">Gap junction</li>
            <li class="credit"><a href="https://openworm.org">OpenWorm</a> data: Varshney et al. 2011, Wang et al. 2024, WormBase Virtual Worm</li>
          </ul>
        </figure>
      </section>

      <section class="panel history">
        <canvas id="chart" class="chart" tabindex="0" role="slider" aria-label="Generation to replay"
          aria-valuemin="1" aria-valuemax="1" aria-valuenow="1"></canvas>
        <div class="controls">
          <dl class="stats">
            <div><dt>Generation</dt><dd id="trained">0</dd></div>
            <div><dt>Latest score</dt><dd id="latest">–</dd></div>
            <div><dt>Best score</dt><dd id="best">–</dd></div>
          </dl>
          <button id="train" type="button">Pause</button>
          <label><input id="follow" type="checkbox" checked /> Follow latest</label>
          <button id="restart" type="button">Restart</button>
        </div>
      </section>
    </main>
    <script type="module" src="./build/App.js"></script>
  </body>
</html>
